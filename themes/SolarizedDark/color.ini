; SolarizedDark: Ethan Schoonover's Solarized palette (https://ethanschoonover.com/solarized/).
; Each [Section] is a color scheme. Values are 6-digit hex WITHOUT '#'.
; Spicetify exposes every key as var(--spice-<key>) and var(--spice-rgb-<key>).
;
; Solarized reference:
;   base03 002B36  base02 073642  base01 586E75  base00 657B83
;   base0  839496  base1  93A1A1  base2  EEE8D5  base3  FDF6E3
;   yellow B58900  orange CB4B16  red DC322F     magenta D33682
;   violet 6C71C4  blue   268BD2  cyan 2AA198    green  859900
;
; Dark mode per the spec: background base03, background highlights base02,
; body text base0, emphasized text base1, secondary/comments base01.
; Solarized is intentionally low-contrast: text base1 on base03 is about 5.6:1.

[Dark]
text               = 93A1A1
subtext            = 839496
main               = 002B36
sidebar            = 002B36
player             = 073642
card               = 073642
shadow             = 000000
selected-row       = 93A1A1
button             = 268BD2
button-active      = 2AA198
button-disabled    = 586E75
tab-active         = 073642
notification       = 268BD2
notification-error = DC322F
misc               = 586E75
