; Each [Section] is a color scheme. Values are 6-digit hex WITHOUT '#'.
; Spicetify exposes every key as var(--spice-<key>) and var(--spice-rgb-<key>).
; All 15 standard keys are required in every section (checked by Test-Theme.ps1).
;
; text               primary text
; subtext            secondary text, artists, timestamps
; main               main view background
; sidebar            left library / nav background
; player             bottom now-playing bar
; card               cards, menus, popups
; shadow             drop shadows
; selected-row       hovered/selected row text tint
; button             accent: play button, active controls, links
; button-active      accent on hover/press
; button-disabled    disabled controls, inactive progress track
; tab-active         active tab / chip background
; notification       info toasts
; notification-error error toasts
; misc               miscellaneous borders and accents

[Dark]
text               = F2F2F2
subtext            = A7A7A7
main               = 121212
sidebar            = 000000
player             = 181818
card               = 1E1E1E
shadow             = 000000
